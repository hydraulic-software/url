name: Native binaries

on:
  push:
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: run-linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: run-linux-arm64
          - runner: macos-15-intel
            artifact: run-macos-amd64
          - runner: macos-15
            artifact: run-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle
      - name: Test and compile native binaries
        run: ./gradlew test nativePair --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/native/nativeCompile/run
          if-no-files-found: error

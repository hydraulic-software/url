name: Website

on:
  push:
    branches: [master]
    paths:
      - site/**
      - .agents/skills/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Each run package is authored as a directory so it can be tested and
      # edited directly. Publish the corresponding ZIP beside each package.
      - name: Package run tools
        run: |
          find site/r -type d -name 'run.zip.d' -print0 |
            while IFS= read -r -d '' package; do
              echo "Packaging $package"
              (
                cd "$package"
                zip -X -r ../run.zip . \
                  -x context.d.ts '*/context.d.ts' timestamp.tsr
              )
            done
      # Agent skills are authored in .agents/skills. Publish each as browsable
      # files and as a ZIP whose top-level directory is the skill's name.
      - name: Package agent skills
        run: |
          mkdir -p site/skills
          cp -R .agents/skills/. site/skills/
          for skill in site/skills/*/; do
            name=$(basename "$skill")
            (cd site/skills && zip -X -r "$name.zip" "$name")
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Website

on:
  push:
    branches: [master]
    paths:
      - site/**
      - .agents/skills/**
      - gradle/**
      - build-logic/**
      - gradlew
      - settings.gradle.kts
      - build-standalone.gradle.kts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Assemble sample sources with their shared helpers, then publish each
      # self-contained ZIP beside its source directory.
      - name: Package run tools
        run: |
          ./gradlew packageRunSamples
          for package in build/run-packages/*; do
            cp "$package/run.zip" "site/r/$(basename "$package")/run.zip"
          done
      # Agent skills are authored in .agents/skills. Publish each as browsable
      # files and as a ZIP whose top-level directory is the skill's name.
      - name: Package agent skills
        run: |
          mkdir -p site/skills
          cp -R .agents/skills/. site/skills/
          for skill in site/skills/*/; do
            name=$(basename "$skill")
            (cd site/skills && zip -X -r "$name.zip" "$name")
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
